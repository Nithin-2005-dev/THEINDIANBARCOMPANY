services:
  postgres:
    image: postgres:15-alpine
    container_name: tib_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tib_db}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tib_db}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tib_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: tib_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    command: ['server', '/data', '--console-address', ':9001']
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    profiles: ['fullstack']
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tib_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tib_db}?schema=public
      PORT: 3000
      REDIS_HOST: redis
      S3_ENDPOINT: http://minio:9000
    ports:
      - '3001:3000'
    command: ['node', 'dist/main.js']
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:3000/api/v1/health || exit 1']
      interval: 20s
      timeout: 5s
      retries: 5

  worker:
    profiles: ['fullstack']
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tib_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tib_db}?schema=public
      REDIS_HOST: redis
      S3_ENDPOINT: http://minio:9000
    command: ['node', 'dist/worker.js']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "const Redis=require(''ioredis''); const client=new Redis({host:process.env.REDIS_HOST, port:Number(process.env.REDIS_PORT), password:process.env.REDIS_PASSWORD || undefined}); client.ping().then((value)=>{client.disconnect(); process.exit(value === ''PONG'' ? 0 : 1);}).catch(()=>process.exit(1));"',
        ]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
